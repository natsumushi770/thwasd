# main で手動実行し、Cargo.toml の version を選んだ種別だけ上げる。
# 上げた版を main にコミットし、vX.Y.Z タグを push する。
# GITHUB_TOKEN によるタグ push は release.yml の push トリガーを起動しない。
# そのためタグを push したあと、同じ実行から release.yml を workflow_call で呼ぶ。
name: 版を上げてリリースする

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 上げる版の種別
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: cut-version
  cancel-in-progress: false

jobs:
  bump:
    name: 版を上げてタグを push する
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: main で実行されていることを確認する
        shell: bash
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$GIT_REF" != "refs/heads/main" ]; then
            echo "このワークフローは main でのみ実行できます（現在: $GIT_REF）" >&2
            exit 1
          fi

      - name: ソースを取得する
        uses: actions/checkout@v7
        with:
          ref: main

      - name: 版を上げる
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          python3 - << 'PY'
          import os
          import re
          import sys
          from pathlib import Path

          kind = os.environ["BUMP"]
          if kind not in {"major", "minor", "patch"}:
              sys.exit(f"版の種別が不正です: {kind}")

          toml_path = Path("Cargo.toml")
          toml = toml_path.read_bytes()
          matches = list(re.finditer(br'(?m)^version = "(\d+)\.(\d+)\.(\d+)"$', toml))
          if len(matches) != 1:
              sys.exit(f"Cargo.toml の version を一意に特定できません: {len(matches)} 件")
          match = matches[0]
          major, minor, patch = (int(match.group(i)) for i in range(1, 4))
          if kind == "major":
              major, minor, patch = major + 1, 0, 0
          elif kind == "minor":
              minor, patch = minor + 1, 0
          else:
              patch += 1
          new = f"{major}.{minor}.{patch}"
          toml = toml[: match.start()] + f'version = "{new}"'.encode() + toml[match.end() :]
          toml_path.write_bytes(toml)

          lock_path = Path("Cargo.lock")
          lock = lock_path.read_bytes()
          lock_re = re.compile(
              br'(\[\[package\]\]\r?\nname = "touhou-wasd"\r?\nversion = ")(\d+\.\d+\.\d+)(")'
          )
          found = lock_re.findall(lock)
          if len(found) != 1:
              sys.exit(f"Cargo.lock の touhou-wasd を一意に特定できません: {len(found)} 件")
          lock, count = lock_re.subn(
              lambda m: m.group(1) + new.encode() + m.group(3), lock, count=1
          )
          if count != 1:
              sys.exit("Cargo.lock を更新できません")
          lock_path.write_bytes(lock)

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={new}\n")
              output.write(f"tag=v{new}\n")
          print(f"version {new}")
          PY

      - name: main とタグを push する
        shell: bash
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --tags origin "refs/tags/${NEW_TAG}" | grep -q .; then
            echo "タグ ${NEW_TAG} は既にあります" >&2
            exit 1
          fi
          git diff -- Cargo.toml Cargo.lock
          git add Cargo.toml Cargo.lock
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "バージョンを ${NEW_VERSION} に上げる"
          git push origin HEAD:main
          git tag "${NEW_TAG}"
          git push origin "refs/tags/${NEW_TAG}"
          {
            echo "### ${NEW_TAG}"
            echo ""
            echo "main にバージョン ${NEW_VERSION} をコミットし、タグ ${NEW_TAG} を push しました。"
            echo "続けて Windows の exe を Release に添付します。"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release をビルドする
    needs: bump
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
