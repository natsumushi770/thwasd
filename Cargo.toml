[package]
name = "touhou-wasd"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A Windows keyboard remapper for Touhou Project"

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
lto = "thin"
strip = true

